# En-têtes de sécurité des fichiers statiques — à inclure dans chaque location
# statique (nginx n'hérite pas des add_header du niveau supérieur dès qu'une
# location en définit un). L'API (/api) envoie les siens via helmet.
#
# CSP : bibliothèques auto-hébergées (assets/vendor). Seuls externes : captcha
# Cloudflare Turnstile et fonds de carte. 'unsafe-inline' (script-src et
# script-src-attr) reste requis par les gestionnaires onclick des pages.
# API sur un autre domaine : l'ajouter à connect-src et img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://*.openfreemap.org https://basemaps.cartocdn.com https://*.cartocdn.com https://api.tomtom.com; connect-src 'self' https://tiles.openfreemap.org https://*.openfreemap.org https://basemaps.cartocdn.com https://*.cartocdn.com https://challenges.cloudflare.com; font-src 'self' data:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
